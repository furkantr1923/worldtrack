name: Derleme ve Test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.29.3'

jobs:
  check:
    name: Analiz + birim/widget testleri
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: SQLite (testler için)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libsqlite3-dev
      - run: mkdir -p logs && flutter pub get
      - name: Statik analiz
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee logs/analyze.log
      - name: Birim ve widget testleri
        run: |
          set -o pipefail
          flutter test -r expanded 2>&1 | tee logs/unit-tests.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-check
          path: logs

  windows:
    name: Windows (Setup.exe + taşınabilir + E2E)
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Hazırlık
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force logs, out | Out-Null
          flutter pub get
      - name: Windows derlemesi (release)
        shell: pwsh
        run: |
          flutter build windows --release 2>&1 | Tee-Object -FilePath logs\windows-build.log
          if (-not (Test-Path build\windows\x64\runner\Release\WORLDTRACK.exe)) { throw 'WORLDTRACK.exe üretilemedi' }
      - name: Visual C++ çalışma zamanını uygulamanın yanına ekle
        shell: pwsh
        run: |
          foreach ($d in 'msvcp140.dll','vcruntime140.dll','vcruntime140_1.dll') {
            Copy-Item "C:\Windows\System32\$d" build\windows\x64\runner\Release\ -Force
          }
          Get-ChildItem build\windows\x64\runner\Release | Format-Table Name, Length | Out-String | Tee-Object -FilePath logs\windows-bundle.txt
      - name: Setup.exe (Inno Setup)
        shell: pwsh
        run: |
          $v = ((Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9.]+)').Matches[0].Groups[1].Value)
          choco install innosetup -y --no-progress | Out-Null
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" installer\worldtrack.iss 2>&1 | Tee-Object -FilePath logs\inno.log
          if (-not (Test-Path "out\WORLDTRACK-$v-Windows-Setup.exe")) { throw 'Setup.exe üretilemedi' }
      - name: Taşınabilir sürüm (zip)
        shell: pwsh
        run: |
          $v = ((Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9.]+)').Matches[0].Groups[1].Value)
          $dir = 'out\WORLDTRACK-Portable'
          Copy-Item build\windows\x64\runner\Release $dir -Recurse
          Set-Content "$dir\portable.txt" 'Bu dosya varken WORLDTRACK verilerini bu klasördeki WORLDTRACK-Veri içinde saklar.'
          Copy-Item tool\ci\BENIOKU-portable.txt "$dir\BENİOKU.txt"
          Compress-Archive -Path $dir -DestinationPath "out\WORLDTRACK-$v-Windows-Portable.zip"
          Remove-Item $dir -Recurse -Force
      - name: Kurulum / açılış / kaldırma testi
        shell: pwsh
        run: ./tool/ci/windows_smoke.ps1
      - name: Uçtan uca test (Windows masaüstü)
        shell: pwsh
        continue-on-error: true
        run: |
          flutter test integration_test/app_test.dart -d windows -r expanded 2>&1 | Tee-Object -FilePath logs\windows-e2e.log
          $code = $LASTEXITCODE
          Copy-Item "$env:TEMP\worldtrack_screens\*.png" out\screens-windows\ -ErrorAction SilentlyContinue
          if ($code -ne 0) { Add-Content logs\windows-smoke.txt 'E2E (Windows): BAŞARISIZ'; exit 1 } else { Add-Content logs\windows-smoke.txt 'E2E (Windows): BAŞARILI' }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            out/*.exe
            out/*.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-windows
          path: |
            logs
            out/screens-windows

  android:
    name: Android (APK + emülatör testi)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: mkdir -p logs out && flutter pub get
      - name: Yayın anahtarı (secret tanımlıysa)
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "WT_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "WT_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "WT_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "WT_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> "$GITHUB_ENV"
      - name: APK derlemesi (release)
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee logs/android-build.log
          V=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          cp build/app/outputs/flutter-apk/app-release.apk "out/WORLDTRACK-$V-Android.apk"
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          {
            echo "== Boyut: $(du -h out/*.apk | cut -f1)"
            "$BT/aapt2" dump badging out/*.apk | grep -E "package:|application-label:|sdkVersion|targetSdkVersion|uses-permission|native-code"
            echo "== İmza"
            "$BT/apksigner" verify --print-certs out/*.apk
          } 2>&1 | tee logs/apk-info.txt
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/*.apk
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emülatör testleri (kurulum, açılış, E2E)
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tool/ci/android_emulator_test.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-android
          path: |
            logs
            out/screens-android

  publish:
    name: Sonuçları 'builds' dalına koy
    if: always() && github.event_name != 'pull_request'
    needs: [check, windows, android]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: art
      - name: Özet
        run: |
          mkdir -p out
          cp art/windows/* out/ 2>/dev/null || true
          cp art/android/* out/ 2>/dev/null || true
          mkdir -p out/logs out/screens
          for d in art/logs-*; do [ -d "$d" ] && cp -r "$d"/. out/logs/ ; done
          mv out/logs/out/screens-windows out/screens/windows 2>/dev/null || true
          mv out/logs/out/screens-android out/screens/android 2>/dev/null || true
          rm -rf out/logs/out
          {
            echo "# Derleme özeti"
            echo "Commit: ${GITHUB_SHA}"
            echo "Zaman: $(date -u +%FT%TZ)"
            echo "check: ${{ needs.check.result }}"
            echo "windows: ${{ needs.windows.result }}"
            echo "android: ${{ needs.android.result }}"
          } > out/STATUS.md
          ls -laR out | head -80
      - name: builds dalına gönder
        run: |
          cd out
          git init -q -b builds
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "Derleme ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" builds

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '{windows,android}'
          path: assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          generate_release_notes: true
